$kind: http-request
url: http://127.0.0.1:8000/api/v1/auth/login
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@example.com\",\r

    \  \"password\": \"Admin12345!\",\r

    \  \"device_name\": \"postman admin\"\r

    }"
scripts:
  - type: afterResponse
    code: "const json = pm.response.json(); \r

      pm.collectionVariables.set('customer_token', json.access_token); "
    language: text/javascript
order: 3000
